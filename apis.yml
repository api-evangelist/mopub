name: MoPub
description: 'MoPub was a mobile advertising and app-monetization platform providing
  ad-network mediation, advanced bidding, and a real-time marketplace/exchange plus
  open-source iOS and Android SDKs for mobile publishers. Founded in 2010, it was acquired
  by Twitter in 2013, then sold to AppLovin for $1.05B in a deal that closed January
  2022. AppLovin migrated publishers to its MAX platform and shut down MoPub''s mediation,
  advanced bidding, and marketplace on 2022-03-31, with dashboard/reporting retired
  by 2022-04-30. MoPub is now defunct: www.mopub.com redirects to applovin.com and
  the developer/API surface (developers.mopub.com) is offline. This profile is retained
  as a historical/defunct record; there is no live MoPub API to enrich.'
